bt_executor_node:
  ros__parameters:
    is_terminal_logging: true
    is_logging: true
    log_folder_name: "logs/"
    loop_rate: 10
    zmq_publisher_port: 1666
    zmq_server_port: 1667
    behavior_trees_path: "trees"
    subtrees_paths: [ "" ]
    default_tree_name: "tree_1"

bt_action_server_node:
  ros__parameters:
    bt_action_server_node: "bt_action_server_node"
    default_tree_name: "tree_1"
    bt_state_topic_name: "bt_state"
    update_dt_sec: 0.1
